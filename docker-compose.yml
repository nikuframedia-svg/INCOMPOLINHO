# PP1 — Industrial APS Scheduler
#
# Mac (dev) — build local para a arquitectura da máquina:
#   docker compose up --build -d      → http://localhost:3000
#
# Linux (deploy) — puxar a imagem multi-arch já publicada no Docker Hub:
#   docker compose pull
#   docker compose up -d              → http://localhost:3000
#   docker compose down               → parar
#
# A mesma imagem (yrdftugyihjonkpmnohugiyftd7r6s/pp1-scheduler:latest) serve ambos os fluxos:
# o `build:` constrói/tag-a localmente; `pull` puxa a variante certa do Hub.
# Ver DOCKER.md §8 + push-image.sh para publicar multi-arch (amd64+arm64).

services:
  pp1:
    build:
      context: .
      dockerfile: Dockerfile
    image: yrdftugyihjonkpmnohugiyftd7r6s/pp1-scheduler:latest
    container_name: pp1-scheduler
    ports:
      # Bind to localhost only. Use an SSH tunnel for remote access:
      #   ssh -L 3000:localhost:${PP1_HTTP_PORT:-3000} user@linux-host
      - "127.0.0.1:${PP1_HTTP_PORT:-3000}:80"
    volumes:
      # ISOP Excel drop folder (optional — uploads also work via the UI).
      - ./isop:/app/isop
      # Persistent SQLite DBs (audit, learning) — survives rebuilds.
      - pp1-data:/app/data
    env_file:
      # AI copilot key. Create it once before the first run:
      #     cp .env.example .env
      # The classic `- .env` form works on every Docker Compose version
      # (the newer `path:`/`required:` syntax needs Compose >= 2.24).
      - .env
    restart: unless-stopped

volumes:
  pp1-data:
